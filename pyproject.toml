[project]
name = "contact"
version = "0.3.0"
dependencies = [
    "pillow",
    "nicegui>=4.0.0",
]

[project.scripts]
contact = "contact:main"
contact-ui = "contact_gui.main:run_app"
contact-gui = "contact_gui.main:run_app"

[tool.hatch.build.targets.wheel]
packages = ["processor", "contact_gui", "contact.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
